name: Build & push API image (GHCR)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to homelab via webhook (push to GHCR always happens)"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bike-tracker-api

jobs:
  validate-schema:
    name: Validate DB schema migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: biketracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://tracker:tracker@localhost:5432/biketracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend deps
        run: pip install -r backend/requirements-selfhost.txt
      - name: Apply migrations to fresh database
        working-directory: backend
        run: alembic upgrade head
      - name: Check migrations match SQLAlchemy models (drift detection)
        working-directory: backend
        run: alembic check
      - name: Round-trip upgrade -> downgrade -> upgrade
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Apply migrations over pre-existing database (idempotency)
        working-directory: backend
        run: |
          alembic upgrade head     # must be a no-op on an up-to-date DB
          alembic current

  build:
    needs: validate-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=bike-tracker-api
            org.opencontainers.image.description=Real-time vehicle telemetry API for the bike-tracker (Honda PCX 160 / AIKA GPS) — polls the AIKA REST API, detects movement events, and broadcasts live positions to clients over WebSocket. Self-hosted FastAPI replacement for the Azure Functions backend.

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Pushed ${{ steps.meta.outputs.tags }} @ ${{ steps.build.outputs.digest }}"

  deploy:
    needs: [validate-schema, build]
    if: inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger homelab deploy webhook (gh_webhooks)
        env:
          CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HOOK_SECRET: ${{ secrets.HOMELAB_WEBHOOK_SECRET }}
        run: |
          # GHCR gets tags like sha-<short7> (metadata-action, prefix=sha-); post
          # the same format here or the webhook pulls a tag that doesn't exist
          TAG="sha-$(printf '%s' "${{ github.sha }}" | cut -c1-7)"
          BODY=$(jq -nc --arg repo "${{ github.repository }}" --arg tag "$TAG" '{repo:$repo, tag:$tag}')
          TS=$(date +%s)
          SIG=$(printf '%s.%s' "$TS" "$BODY" | openssl dgst -sha256 -hmac "$HOOK_SECRET" -r | cut -d' ' -f1)
          echo "Triggering webhook for ${BODY}"
          curl --fail-with-body --show-error --retry 3 --retry-all-errors --max-time 30 \
            --write-out '\nHTTP status: %{http_code}\n' \
            -H "CF-Access-Client-Id: $CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CLIENT_SECRET" \
            -H "X-Timestamp: $TS" -H "X-Signature: $SIG" \
            -H "Content-Type: application/json" --data "$BODY" \
            https://apis.adolfrey.com/gh_webhooks/d
