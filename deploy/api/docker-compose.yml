# Production deployment (self-hosted homelab)
#
# Located in the repo at deploy/api/docker-compose.yml. On the server:
#   mkdir -p /srv/deploy/api && cd /srv/deploy/api
#   git clone <repo> repo    # or: git -C repo pull, then cp repo/deploy/api/docker-compose.yml .
#   cp repo/.env.example .env && vi .env   # must set POSTGRES_PASSWORD
#
# Deployed by the gh_webhooks webhook (triggered by publish-api-ghcr.yml),
# which pins TAG to the pushed commit SHA:
#   TAG=<sha> docker compose pull api
#   TAG=<sha> docker compose up -d --remove-orphans

name: bike-tracker

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set in .env}
      POSTGRES_DB: biketracker
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d biketracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs migrations (same image), waits for the DB, then exits.
  migrate:
    image: ghcr.io/adolf94/bike-tracker-api:${TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tracker:${POSTGRES_PASSWORD}@db:5432/biketracker
    working_dir: /app
    command: alembic upgrade head

  api:
    image: ghcr.io/adolf94/bike-tracker-api:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tracker:${POSTGRES_PASSWORD}@db:5432/biketracker
    ports:
      - "127.0.0.1:8000:8000"   # only Cloudflare Tunnel touches this (loopback)
